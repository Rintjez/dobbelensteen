<!DOCTYPE html> <html lang="nl"> <head> <meta charset="UTF-8"> <meta name="viewport"content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>3D Dobbelsteen App</title> <!-- Apple Web App Meta Tags --> <meta name="apple-mobile-web-app-capable" content="yes"> <meta name="apple-mobile-web-app-status-bar-style"content="black-translucent"> <meta name="apple-mobile-web-app-title" content="3D Dice"> <style> body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #1c1c1e; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; user-select: none; -webkit-user-select: none; box-sizing: border-box; padding: 40px 20px; overflow: hidden; } /* Selector bovenin */ .controls { display: flex; background-color: #2c2c2e; padding: 4px; border-radius: 9px; width: 100%; max-width: 340px; z-index: 10; } .segment-btn { flex: 1; background: none; border: none; color: #aeaea3; padding: 8px 0; font-size: 14px; font-weight: 600; border-radius: 7px; cursor: pointer; } .segment-btn.active { background-color: #636366; color: #ffffff; } /* Totaal score display */ .total-display { font-size: 20px; font-weight: 500; color: #8e8e93; min-height: 40px; } .total-display span { color: #ffffff; font-size: 32px; font-weight: bold; } /* 3D Scene en Container */ .dice-container { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 40px 30px; width: 100%; max-width: 340px; perspective: 600px; } /* 3D Kubus Structuur */ .scene { width: 80px; height: 80px; margin: 10px; } .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.3, 1); } /* De 6 vlakken van de dobbelsteen */ .cube-face { position: absolute; width: 80px; height: 80px; background: #ffffff; border: 2px solid #e5e5ea; color: #000000; font-size: 36px; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 14px; box-shadow: inset 0 0 15px rgba(0,0,0,0.1), 0 4px 10px rgba(0,0,0,0.15); box-sizing: border-box; } /* Positionering van de vlakken in de 3D ruimte */ .face-1 { transform: rotateY(0deg) translateZ(40px); } .face-6 { transform: rotateY(180deg) translateZ(40px); } .face-3 { transform: rotateY(90deg) translateZ(40px); } .face-4 { transform: rotateY(-90deg) translateZ(40px); } .face-2 { transform: rotateX(90deg) translateZ(40px); } .face-5 { transform: rotateX(-90deg) translateZ(40px); } /* Schaling voor grotere aantallen zodat het op je scherm past */ .scene.small { width: 65px; height: 65px; } .scene.small .cube-face { width: 65px; height: 65px; font-size: 28px; border-radius: 10px; } .scene.small .face-1 { transform: rotateY(0deg) translateZ(32.5px); } .scene.small .face-6 { transform: rotateY(180deg) translateZ(32.5px); } .scene.small .face-3 { transform: rotateY(90deg) translateZ(32.5px); } .scene.small .face-4 { transform: rotateY(-90deg) translateZ(32.5px); } .scene.small .face-2 { transform: rotateX(90deg) translateZ(32.5px); } .scene.small .face-5 { transform: rotateX(-90deg) translateZ(32.5px); } /* Grote knop onderin */ .roll-btn { background-color: #007aff; color: white; border: none; width: 100%; max-width: 340px; padding: 16px; font-size: 18px; font-weight: 600; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,122,255,0.3); z-index: 10; } .roll-btn:active { background-color: #0056b3; } </style> </head> <body> <!-- Aantal kiezen --> <divclass="controls"> <button class="segment-btn active" onclick="changeDiceCount(1, this)">1</button> <button class="segment-btn" onclick="changeDiceCount(2, this)">2</button> <button class="segment-btn" onclick="changeDiceCount(3, this)">3</button> <buttonclass="segment-btn" onclick="changeDiceCount(4, this)">4</button> <button class="segment-btn"onclick="changeDiceCount(5, this)">5</button> <button class="segment-btn"onclick="changeDiceCount(6, this)">6</button> </div> <!-- Totaal aantal ogen --> <divclass="total-display" id="totalDisplay">Totaal: <span id="totalValue">1</span></div> <!-- Container voor de 3D Scenes --> <div class="dice-container" id="diceContainer"> <divclass="scene"> <div class="cube" id="cube-0" style="transform: rotateX(0deg) rotateY(0deg);"> <div class="cube-face face-1">1</div> <div class="cube-face face-2">2</div> <div class="cube-face face-3">3</div> <div class="cube-face face-4">4</div> <div class="cube-face face-5">5</div> <div class="cube-face face-6">6</div> </div> </div> </div> <!-- Werpknop --><button class="roll-btn" onclick="rollAllDice()">Gooi 3D stenen</button> <script> let currentDiceCount = 1; let currentValues =; function changeDiceCount(count, buttonElement) { currentDiceCount = count; document.querySelectorAll('.segment-btn').forEach(btn => btn.classList.remove('active')); buttonElement.classList.add('active'); const container = document.getElementById('diceContainer'); container.innerHTML = ''; currentValues = []; let total = 0; for (let i = 0; i < count; i++) { currentValues.push(1); total += 1; const scene = document.createElement('div'); scene.className = count > 4 ? 'scene small' : 'scene'; scene.innerHTML = ` <div class="cube" id="cube-${i}" style="transform: rotateX(0deg) rotateY(0deg);"> <div class="cube-face face-1">1</div> <div class="cube-face face-2">2</div> <div class="cube-face face-3">3</div> <div class="cube-face face-4">4</div> <div class="cube-face face-5">5</div> <div class="cube-face face-6">6</div> </div> `; container.appendChild(scene); } document.getElementById('totalValue').innerText = total; } function rollAllDice() { let total = 0; for (let i = 0; i < currentDiceCount; i++) { const cube = document.getElementById(`cube-${i}`); const randomNumber = Math.floor(Math.random() * 6) + 1; currentValues[i] = randomNumber; total += randomNumber; // Extra rotaties voor een realistisch spinnend effect const extraX = (Math.floor(Math.random() * 3) + 3) * 360; const extraY = (Math.floor(Math.random() * 3) + 3) * 360; let rotationStyles = ''; if(randomNumber === 1) rotationStyles = `rotateX(${extraX}deg) rotateY(${extraY}deg)`; if(randomNumber === 6) rotationStyles = `rotateX(${extraX}deg) rotateY(${extraY + 180}deg)`; if(randomNumber === 3) rotationStyles = `rotateX(${extraX}deg) rotateY(${extraY - 90}deg)`; if(randomNumber === 4) rotationStyles = `rotateX(${extraX}deg) rotateY(${extraY + 90}deg)`; if(randomNumber === 2) rotationStyles = `rotateX(${extraX - 90}deg) rotateY(${extraY}deg)`; if(randomNumber === 5) rotationStyles = `rotateX(${extraX + 90}deg) rotateY(${extraY}deg)`; cube.style.transform = rotationStyles; } document.getElementById('totalValue').innerText = total; } </script> </body> </html>
