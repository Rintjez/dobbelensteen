

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Dobbelstenen</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #2c3e50;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .controls {
            margin-bottom: 40px;
            text-align: center;
        }

        label {
            font-size: 18px;
            margin-right: 10px;
        }

        select, button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        select {
            background-color: #ecf0f1;
            color: #333333;
            margin-right: 15px;
        }

        button {
            background-color: #e74c3c;
            color: #ffffff;
        }

        #dice-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            max-width: 800px;
            perspective: 600px;
        }

        .dice {
            position: relative;
            width: 100px;
            height: 100px;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .face {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #ffffff;
            border: 2px solid #cccccc;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 65px;
            line-height: 100px;
            color: #333333;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
            box-sizing: border-box;
            user-select: none;
        }

        /* Vaste 3D posities voor de vlakken */
        .f1 { transform: rotateY(0deg) translateZ(50px); }
        .f2 { transform: rotateY(180deg) translateZ(50px); }
        .f3 { transform: rotateY(90deg) translateZ(50px); }
        .f4 { transform: rotateY(-90deg) translateZ(50px); }
        .f5 { transform: rotateX(90deg) translateZ(50px); }
        .f6 { transform: rotateX(-90deg) translateZ(50px); }
    </style>
</head>
<body>

    <div class="controls">
        <label for="dice-count">Aantal dobbelstenen:</label>
        <select id="dice-count" onchange="createDice()">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
        </select>
        <button onclick="rollAll()">Rol Dobbelstenen!</button>
    </div>

    <div id="dice-container"></div>

    <script>
        // HTML voor de vlakken (Unicode karakters, geen losse afbeeldingen)
        const facesHTML = [
            '<div class="face f1">&#9856;</div>', // ⚀
            '<div class="face f2">&#9857;</div>', // ⚁
            '<div class="face f3">&#9858;</div>', // ⚂
            '<div class="face f4">&#9859;</div>', // ⚃
            '<div class="face f5">&#9860;</div>', // ⚄
            '<div class="face f6">&#9861;</div>'  // ⚅
        ];

        const rotations = {
            1: { x: 0,   y: 0 },
            2: { x: 0,   y: 180 },
            3: { x: 0,   y: -90 },
            4: { x: 0,   y: 90 },
            5: { x: -90, y: 0 },
            6: { x: 90,  y: 0 }
        };

        function createDice() {
            const container = document.getElementById('dice-container');
            const count = parseInt(document.getElementById('dice-count').value, 10);
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const dice = document.createElement('div');
                dice.className = 'dice';
                dice.innerHTML = facesHTML.join('');
                container.appendChild(dice);
            }
        }

        function rollAll() {
            const diceElements = document.querySelectorAll('.dice');
            
            diceElements.forEach(dice => {
                const resultaat = Math.floor(Math.random() * 6) + 1;
                
                const extraRondjesX = (Math.floor(Math.random() * 3) + 2) * 360;
                const extraRondjesY = (Math.floor(Math.random() * 3) + 2) * 360;

                const targetX = rotations[resultaat].x + extraRondjesX;
                const targetY = rotations[resultaat].y + extraRondjesY;

                dice.style.transform = `rotateX(${targetX}deg) rotateY(${targetY}deg)`;
            });
        }

        // Start direct bij het laden van de pagina
        createDice();
    </script>
</body>
</html>
